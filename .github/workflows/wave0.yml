name: Cognitura Wave 0

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-wave0:
    name: Verify Wave 0
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_DB: cognitura_ci
          POSTGRES_USER: cognitura_ci
          POSTGRES_PASSWORD: cognitura_ci_ephemeral
        options: >-
          --health-cmd "pg_isready -U cognitura_ci -d cognitura_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"
          check-latest: false
          cache: maven
          cache-dependency-path: |
            pom.xml
            server/pom.xml
            .mvn/wrapper/maven-wrapper.properties

      - name: Set up pnpm 11.17.0
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node 24.18.0 and pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          check-latest: false
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            tests/contracts/schema/pnpm-lock.yaml

      - name: Verify the complete Wave 0 baseline
        run: scripts/verify-wave0
