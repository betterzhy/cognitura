<!doctype html>
<html lang="en" data-comparison-ready="false">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cognitura Visual Style Family Comparison</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 32px;
        padding: 32px;
        color: #172033;
        background: #f7f9fc;
        font: 600 20px/1.4 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      figure { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 16px; min-width: 0; margin: 0; }
      figcaption { text-align: center; }
      img { width: 100%; height: 100%; min-height: 0; object-fit: contain; }
    </style>
  </head>
  <body>
    <figure>
      <figcaption>Historical Visual Style Reference — style only</figcaption>
      <img id="reference-image" alt="Historical visual style reference" />
    </figure>
    <figure>
      <figcaption>New Module Default Reading — Reading First</figcaption>
      <img id="candidate-image" alt="New Module Default Reading" />
    </figure>
    <script>
      (() => {
        "use strict";
        const parameters = new URLSearchParams(location.search);
        const paths = [parameters.get("reference"), parameters.get("candidate")];
        if (paths.some((path) => path === null || !path.startsWith("/__assets/"))) {
          return;
        }
        const images = [
          document.getElementById("reference-image"),
          document.getElementById("candidate-image"),
        ];
        images.forEach((image, index) => {
          image.src = paths[index];
        });
        Promise.all(images.map((image) => image.decode()))
          .then(() => {
            if (images.every((image) => image.naturalWidth > 0)) {
              document.documentElement.dataset.comparisonReady = "true";
            }
          })
          .catch(() => {
            document.documentElement.dataset.comparisonReady = "false";
          });
      })();
    </script>
  </body>
</html>
